<script>
(function () {
    var STORAGE_KEY = "skunk-color-mode";
    var root = document.documentElement;
    var buttons = document.querySelectorAll(".theme-switch__btn");

    function apply(mode) {
        root.setAttribute("data-color-mode", mode);
        buttons.forEach(function (btn) {
            btn.setAttribute("aria-pressed", btn.dataset.themeChoice === mode ? "true" : "false");
        });
    }

    var stored = null;
    try {
        stored = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
        /* localStorage unavailable (private mode, etc.) - fall back to system */
    }

    apply(stored || "user");

    buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
            var mode = btn.dataset.themeChoice;
            try {
                localStorage.setItem(STORAGE_KEY, mode);
            } catch (e) {
                /* ignore - theme just won't persist */
            }
            apply(mode);
        });
    });
})();
</script>
<script>
(function () {
    var header = document.querySelector("header");
    if (!header) return;

    function syncHeaderHeight() {
        document.documentElement.style.setProperty("--header-height", header.offsetHeight + "px");
    }

    syncHeaderHeight();
    window.addEventListener("resize", syncHeaderHeight);

    var lastScrollY = window.scrollY;
    var ticking = false;

    function onScroll() {
        var currentScrollY = window.scrollY;

        if (currentScrollY <= header.offsetHeight) {
            header.classList.remove("header--hidden");
        } else if (currentScrollY > lastScrollY) {
            header.classList.add("header--hidden");
        } else if (currentScrollY < lastScrollY) {
            header.classList.remove("header--hidden");
        }

        lastScrollY = currentScrollY;
        ticking = false;
    }

    window.addEventListener("scroll", function () {
        if (!ticking) {
            window.requestAnimationFrame(onScroll);
            ticking = true;
        }
    }, { passive: true });
})();
</script>
