<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- chip package -->
  <g fill="#f8fafc">
    <rect x="176" y="176" width="160" height="160" rx="26"/>
    <!-- pins -->
    <rect x="210" y="148" width="12" height="28"/>
    <rect x="250" y="148" width="12" height="28"/>
    <rect x="290" y="148" width="12" height="28"/>
    <rect x="210" y="336" width="12" height="28"/>
    <rect x="250" y="336" width="12" height="28"/>
    <rect x="290" y="336" width="12" height="28"/>
    <rect x="148" y="210" width="28" height="12"/>
    <rect x="148" y="250" width="28" height="12"/>
    <rect x="148" y="290" width="28" height="12"/>
    <rect x="336" y="210" width="28" height="12"/>
    <rect x="336" y="250" width="28" height="12"/>
    <rect x="336" y="290" width="28" height="12"/>
  </g>

  <!-- diagnostic pulse -->
  <path d="M196,256 L222,256 L234,226 L258,300 L272,206 L286,256 L316,256"
        fill="none" stroke="#34d399" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
